services:
  dev:
    image: golang:1.24.2
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - .:/workspace

  lantern:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - serve
      - --no-tui
      - --db
      - /home/nonroot/.lantern/data.db
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    ports:
      - "${LANTERN_OTLP_GRPC_PORT:-4317}:4317"
      - "${LANTERN_OTLP_HTTP_PORT:-4318}:4318"
      - "${LANTERN_UI_PORT:-4000}:4000"
    volumes:
      - lantern-data:/home/nonroot/.lantern

  checkout-demo:
    image: python:3.12-slim
    depends_on:
      - lantern
    command:
      - /bin/sh
      - -lc
      - |
          pip install --no-cache-dir \
            opentelemetry-api==1.32.0 \
            opentelemetry-sdk==1.32.0 \
            opentelemetry-exporter-otlp-proto-grpc==1.32.0
          python - <<'PY'
          import time
          from opentelemetry import trace
          from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
          from opentelemetry.sdk.resources import Resource
          from opentelemetry.sdk.trace import TracerProvider
          from opentelemetry.sdk.trace.export import BatchSpanProcessor

          resource = Resource.create({"service.name": "checkout-demo"})
          provider = TracerProvider(resource=resource)
          provider.add_span_processor(
              BatchSpanProcessor(OTLPSpanExporter(endpoint="lantern:4317", insecure=True))
          )
          trace.set_tracer_provider(provider)
          tracer = trace.get_tracer("checkout-demo")

          while True:
              with tracer.start_as_current_span("POST /checkout"):
                  with tracer.start_as_current_span("reserve-stock"):
                      time.sleep(0.08)
                  with tracer.start_as_current_span("charge-card"):
                      time.sleep(0.12)
              provider.force_flush()
              time.sleep(3)
          PY

volumes:
  lantern-data:
