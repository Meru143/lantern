name: Bug report
description: Report a reproducible problem in lantern.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Paste commands, config, and a minimal sequence that reproduces the issue.
      placeholder: |
        1. Start lantern with ...
        2. Send OTLP traffic with ...
        3. Open ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Include terminal output, stack traces, or UI screenshots if available.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `lantern --version` or the commit SHA you built from.
